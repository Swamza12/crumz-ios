name: Crumz
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.29.0

targets:
  Crumz:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Crumz
    info:
      path: Crumz/Info.plist
      properties:
        CFBundleDisplayName: Crumz
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Crumz needs camera access so you can scan campus vendor QR codes to pay securely."
        NSLocationWhenInUseUsageDescription: "Crumz uses your location to show nearby partnered campus vendors and guide you with turn-by-turn walking or driving directions."
        GMSApiKey: "AIzaSyCUsAeQRB52x8bTt3shodSr8dsqOf427lg"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.crumz
        INFOPLIST_FILE: Crumz/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
